name: Integrate avis clients

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip avis]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate review CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          marker = '<!-- AVIS CTA INTEGRATION -->'
          if marker not in html:
              pattern = re.compile(r'(<section\\b[^>]*class=["\\\'][^"\\\']*\\breviews-section\\b[^"\\\']*["\\\'][^>]*>)', re.I)
              match = pattern.search(html)
              if not match:
                  raise SystemExit('Section reviews-section introuvable: aucune modification effectuée.')

              cta = '''\n\n    <!-- AVIS CTA INTEGRATION -->\n    <div class="reviews-cta">\n        <a href="/avis" class="btn btn-primary">\n            Laisser un avis\n            <span>→</span>\n        </a>\n    </div>\n'''
              html = html[:match.end()] + cta + html[match.end():]
              index.write_text(html, encoding='utf-8')

          css = Path('style.css')
          styles = css.read_text(encoding='utf-8')
          css_marker = '/* AVIS CTA INTEGRATION */'
          if css_marker not in styles:
              styles += '''\n\n/* AVIS CTA INTEGRATION */\n.reviews-cta {\n    display: flex;\n    justify-content: center;\n    margin: -28px 0 45px;\n    position: relative;\n    z-index: 2;\n}\n\n@media (max-width: 600px) {\n    .reviews-cta {\n        margin: -18px 0 32px;\n    }\n}\n'''
              css.write_text(styles, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-avis-home.yml
          git add index.html style.css
          git diff --cached --quiet || git commit -m "feat: integrate avis clients on homepage [skip avis]"
          git push
