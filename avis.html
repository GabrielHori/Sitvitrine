<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Avis Google | Horizon IT</title>
    <meta name="description" content="Consultez les avis clients Horizon IT et partagez votre expérience sur Google.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#edf4f8;--card:#fff;--text:#102238;--muted:#40566d;--border:#c8d6e0;--accent:#00a6c2;--accent-dark:#00879f;--shadow:0 18px 50px rgba(16,34,56,.10)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100vh;background:linear-gradient(135deg,#edf4f8,#dce8ef);color:var(--text);font-family:Inter,sans-serif;line-height:1.6}
        a{color:inherit;text-decoration:none}
        .page{width:min(900px,calc(100% - 32px));margin:auto;padding:28px 0 60px}
        .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:72px}
        .logo{font:700 1.35rem 'Space Grotesk',sans-serif;letter-spacing:-.05em}.logo span{color:var(--accent)}
        .back{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.72);font-size:.9rem;font-weight:600}
        .panel{max-width:720px;margin:0 auto;padding:clamp(26px,6vw,52px);background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);text-align:center}
        .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--accent-dark);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em}.eyebrow:before{content:'';width:24px;height:2px;background:var(--accent);border-radius:2px}
        h1{font:700 clamp(2.2rem,6vw,3.5rem)/1.08 'Space Grotesk',sans-serif;letter-spacing:-.05em;margin:16px 0}
        .intro{max-width:540px;margin:0 auto;color:var(--muted);font-size:1.02rem}
        .google-link{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:28px;padding:15px 22px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;transition:background .2s,transform .2s}
        .google-link:hover{background:var(--accent-dark);transform:translateY(-1px)}
        .note{margin-top:18px;color:#718597;font-size:.82rem}
        @media(max-width:520px){.topbar{margin-bottom:42px}.page{padding-top:20px}.back{font-size:.8rem;padding:8px 10px}.google-link{width:100%}}
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <a href="/" class="logo">HORIZON <span>IT</span></a>
            <a href="/" class="back">← Retour au site</a>
        </header>

        <section class="panel">
            <span class="eyebrow">Avis clients</span>
            <h1>Les avis Horizon IT sont sur Google.</h1>
            <p class="intro">Consultez les avis publiés sur la fiche Google Horizon IT ou partagez votre expérience directement sur Google.</p>
            <a class="google-link" href="https://share.google/KF40bfuhpMLgVI3D0" target="_blank" rel="noopener noreferrer">
                Voir les avis et la fiche Google <span aria-hidden="true">↗</span>
            </a>
            <p class="note">Vous serez redirigé vers Google pour consulter ou déposer un avis.</p>
        </section>
    </main>
</body>
</html>
